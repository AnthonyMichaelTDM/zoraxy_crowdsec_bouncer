# compose file used to test the zoraxy crowdsec bouncer plugin end-to-end

networks:
  zoraxy-shared:
    name: zoraxy-crowdsec-bouncer_default

services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec-bouncer-crowdsec
    restart: unless-stopped
    networks:
      - zoraxy-shared
    volumes:
      - ./build/crowdsec/config/:/etc/crowdsec/
      - ./build/crowdsec/data/:/var/lib/crowdsec/data/

  zoraxy:
    image: zoraxydocker/zoraxy:v3.2.9
    container_name: crowdsec-bouncer-zoraxy
    restart: unless-stopped
    depends_on:
      - crowdsec
    ports:
      - 18080:80
      - 8443:443
      - 8000:8000
    networks:
      - zoraxy-shared
    volumes:
      - ./build/config/:/opt/zoraxy/config/
      - ./build/plugins/:/opt/zoraxy/plugin/
      # Docker socket path can differ between rootful/rootless Docker.
      # Override with DOCKER_SOCKET_PATH if needed.
      - ${DOCKER_SOCKET_PATH:-/run/user/1000/docker.sock}:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FASTGEOIP: "true"

  test_webserver:
    image: hashicorp/http-echo:1.0
    container_name: crowdsec-bouncer-test-webserver
    restart: unless-stopped
    command:
      - "-listen=:5678"
      - "-text=Zoraxy CrowdSec Bouncer E2E test server is reachable"
    expose:
      - "5678"
    networks:
      zoraxy-shared:
        aliases:
          - test-webserver
